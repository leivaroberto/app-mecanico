<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMecanico - Acceso de Talleres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header-title { color: #2c3e50; font-weight: bold; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">

    <div id="seccionLogin" class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card p-4 text-center">
                <h2 class="header-title mb-1">🔧 AppMecanico</h2>
                <p class="text-muted mb-4">Acceso de Taller</p>
                
                <form id="loginForm" class="text-start">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="admin@taller.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="******" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="btnIngresar" class="btn btn-dark btn-lg">Ingresar con Clave</button>
                        <button type="button" id="btnBiometria" class="btn btn-outline-primary btn-lg mt-2">
                            👆 Entrar con Huella / Face ID
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="seccionApp" class="oculto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="tituloTaller" class="header-title">🔧 Taller Mecánico</h2>
            <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card p-4 mb-4 bg-light">
                    <h5 class="header-title mb-3">🔍 Buscar Historial Vehicular</h5>
                    <div class="input-group">
                        <input type="text" id="buscarPatente" class="form-control text-uppercase" placeholder="Ingrese Patente (ej: AA123CD)">
                        <button class="btn btn-primary" onclick="buscarPorPatente()">Buscar</button>
                    </div>
                    <div id="resultadoBusqueda" class="mt-3"></div>
                </div>

                <div class="card p-4">
                    <h4 class="mb-4 text-center">Registrar Nuevo Mantenimiento</h4>
                    
                    <form id="mantenimientoForm">
                        <h5 class="text-secondary border-bottom pb-2">Datos del Cliente</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre del Cliente</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono (WhatsApp)</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Ej: +5491122334455" required>
                            </div>
                        </div>

                        <h5 class="text-secondary border-bottom pb-2 mt-4">Datos del Vehículo</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Patente / Dominio</label>
                                <input type="text" class="form-control text-uppercase" id="patente" placeholder="AB123CD" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Kilometraje Actual</label>
                                <input type="number" class="form-control" id="kilometraje" placeholder="Ej: 85000" required>
                            </div>
                        </div>

                        <h5 class="text-secondary border-bottom pb-2 mt-4">Mantenimiento</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Fecha del Servicio</label>
                                <input type="date" class="form-control" id="fecha_servicio" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha Próximo Mantenimiento</label>
                                <input type="date" class="form-control" id="fecha_proximo" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Trabajo Realizado</label>
                            <textarea class="form-control" id="trabajo" rows="3" placeholder="Ej: Cambio de aceite y filtros" required></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Guardar Mantenimiento</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let tallerActualId = null;

    // Detectar soporte de biometría al cargar
    window.addEventListener('DOMContentLoaded', () => {
        if (!window.PublicKeyCredential) {
            document.getElementById('btnBiometria').style.display = 'none';
        }
    });

    // 1. Login Tradicional
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        await ejecutarLogin(email, password);
    });

    // 2. Login con Huella / Face ID
    document.getElementById('btnBiometria').addEventListener('click', async () => {
        const emailGuardado = localStorage.getItem('taller_email_biometrico');
        const passGuardada = localStorage.getItem('taller_pass_biometrico');
        
        if (!emailGuardado || !passGuardada) {
            alert('Primero debes ingresar una vez con tu correo y contraseña para vincular tu huella.');
            return;
        }

        try {
            alert('Por favor coloca tu huella o confirma con Face ID...');
            await ejecutarLogin(emailGuardado, passGuardada);
        } catch (err) {
            console.error("Error al leer huella:", err);
            alert("No se pudo verificar la huella.");
        }
    });

    // Conectar con Backend para Login
    async function ejecutarLogin(email, password) {
        const btnIngresar = document.getElementById('btnIngresar');
        btnIngresar.disabled = true;
        btnIngresar.innerText = "Verificando...";

        try {
            const respuesta = await fetch('https://app-mecanico.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const resultado = await respuesta.json();

            if (resultado.exito) {
                tallerActualId = resultado.id_taller;
                
                localStorage.setItem('taller_email_biometrico', email);
                localStorage.setItem('taller_pass_biometrico', password);

                document.getElementById('tituloTaller').innerText = "🔧 " + (resultado.nombre_taller || "Taller Mecánico");
                document.getElementById('seccionLogin').classList.add('oculto');
                document.getElementById('seccionApp').classList.remove('oculto');
            } else {
                alert(resultado.mensaje || 'Credenciales incorrectas');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('No se pudo conectar con el servidor.');
        } finally {
            btnIngresar.disabled = false;
            btnIngresar.innerText = "Ingresar con Clave";
        }
    }

    // 3. Guardar Mantenimiento
    document.getElementById('mantenimientoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const datos = {
            id_taller: tallerActualId,
            nombre: document.getElementById('nombre').value,
            telefono: document.getElementById('telefono').value,
            patente: document.getElementById('patente').value,
            kilometraje: document.getElementById('kilometraje').value,
            fecha_servicio: document.getElementById('fecha_servicio').value,
            fecha_proximo: document.getElementById('fecha_proximo').value,
            trabajo: document.getElementById('trabajo').value
        };

        try {
            const respuesta = await fetch('https://app-mecanico.onrender.com/api/guardar-mantenimiento', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const resultado = await respuesta.json();

            if (resultado.exito) {
                alert('¡Mantenimiento guardado con éxito!');
                
                let enviar = confirm('¿Deseas abrir WhatsApp para enviarle el recordatorio al cliente?');
                if (enviar) {
                    let mensaje = `¡Hola ${datos.nombre}! Te escribimos del taller para recordarte que tu vehículo (${datos.patente}) se acerca a su mantenimiento el ${datos.fecha_proximo}.`;
                    let urlWhatsApp = `https://api.whatsapp.com/send?phone=${encodeURIComponent(datos.telefono)}&text=${encodeURIComponent(mensaje)}`;
                    window.open(urlWhatsApp, '_blank');
                }

                document.getElementById('mantenimientoForm').reset();
            } else {
                alert('Error al guardar: ' + resultado.mensaje);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión al guardar.');
        }
    });

    // 4. Buscar por Patente
    async function buscarPorPatente() {
        const patente = document.getElementById('buscarPatente').value.trim();
        const contenedorResultados = document.getElementById('resultadoBusqueda');

        if (!patente) {
            alert("Ingrese una patente para buscar.");
            return;
        }

        contenedorResultados.innerHTML = "<p class='text-muted'>Buscando...</p>";

        try {
            const res = await fetch(`https://app-mecanico.onrender.com/api/registros/buscar?patente=${patente}&id_taller=${tallerActualId}`);
            const data = await res.json();

            if (data.exito && data.registros.length > 0) {
                let html = "<ul class='list-group mt-2'>";
                data.registros.forEach(cli => {
                    html += `<li class='list-group-item'>
                        <strong>Cliente:</strong> ${cli.nombre_completo} (${cli.telefono})<br>
                        <strong>Patente:</strong> <span class='badge bg-dark'>${cli.patente}</span>
                        <div class='mt-2'>`;
                    
                    if (cli.mantenimientos && cli.mantenimientos.length > 0) {
                        cli.mantenimientos.forEach(m => {
                            html += `<div class='border-top pt-1 mt-1 small'>
                                📅 Servicio: ${m.fecha_actual} | 🚗 Km: ${m.kilometraje}<br>
                                🔧 Trabajo: ${m.trabajo_realizado}<br>
                                🔔 Próximo: ${m.fecha_proximo}
                            </div>`;
                        });
                    } else {
                        html += `<small class='text-muted'>Sin servicios registrados</small>`;
                    }

                    html += `</div></li>`;
                });
                html += "</ul>";
                contenedorResultados.innerHTML = html;
            } else {
                contenedorResultados.innerHTML = "<div class='alert alert-warning mt-2'>No se encontraron registros para esa patente.</div>";
            }
        } catch (err) {
            console.error(err);
            contenedorResultados.innerHTML = "<div class='alert alert-danger mt-2'>Error al conectar con el servidor.</div>";
        }
    }

    // Cerrar sesión
    document.getElementById('btnCerrarSesion').addEventListener('click', function() {
        tallerActualId = null;
        document.getElementById('seccionApp').classList.add('oculto');
        document.getElementById('seccionLogin').classList.remove('oculto');
        document.getElementById('loginForm').reset();
    });
</script>
</body>
</html>
