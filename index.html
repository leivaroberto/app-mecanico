<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMecanico - Gestión de Talleres</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header-title { color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="header-title">🔧 Taller "El Chamo"</h2>
        <button class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h4 class="mb-4 text-center">Registrar Nuevo Mantenimiento</h4>
                
                <form action="#" method="POST">
                    <h5 class="text-secondary border-bottom pb-2">Datos del Cliente</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre del Cliente</label>
                            <input type="text" class="form-control" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono (WhatsApp)</label>
                            <input type="tel" class="form-control" placeholder="+54 9 11 1234-5678" required>
                        </div>
                    </div>

                    <h5 class="text-secondary border-bottom pb-2 mt-4">Datos del Vehículo</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Patente / Dominio</label>
                            <input type="text" class="form-control text-uppercase" placeholder="AB 123 CD" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Kilometraje Actual</label>
                            <input type="number" class="form-control" placeholder="Ej. 50000" required>
                        </div>
                    </div>

                    <h5 class="text-secondary border-bottom pb-2 mt-4">Mantenimiento</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha del Servicio</label>
                            <input type="date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha Próximo Mantenimiento</label>
                            <input type="date" class="form-control" required>
                            <div class="form-text text-success">Se enviará un aviso por WhatsApp 1 semana antes.</div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Trabajo Realizado</label>
                        <textarea class="form-control" rows="3" placeholder="Ej. Cambio de aceite 10w40, filtros de aire y combustible..." required></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Guardar y Programar Aviso</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
