<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMecanico - Panel de Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .header-title { color: #2c3e50; font-weight: bold; }
        .oculto { display: none !important; }
        .nav-tabs .nav-link { font-weight: 600; color: #6c757d; }
        .nav-tabs .nav-link.active { color: #2b6cb0; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-4 mb-5">

    <div id="seccionLogin" class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card p-4 text-center">
                <h2 class="header-title mb-1">🔧 AppMecanico</h2>
                <p class="text-muted mb-4">Acceso Seguro de Taller</p>
                <form id="loginForm" class="text-start">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="btnIngresar" class="btn btn-dark btn-lg">Ingresar</button>
                        <button type="button" id="btnBiometria" class="btn btn-outline-primary mt-2">👆 Entrar con Huella</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="seccionApp" class="oculto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="tituloTaller" class="header-title">🔧 Taller Mecánico</h2>
            <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>

        <ul class="nav nav-tabs mb-4" id="appTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button" role="tab">📊 Inicio</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="buscar-tab" data-bs-toggle="tab" data-bs-target="#buscar" type="button" role="tab">🔍 Buscar Historial</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="nuevo-tab" data-bs-toggle="tab" data-bs-target="#nuevo" type="button" role="tab">📝 Registrar Servicio</button>
            </li>
        </ul>

        <div class="tab-content">
            
            <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card bg-primary text-white p-3 text-center">
                            <h5>Vehículos Atendidos este Mes</h5>
                            <h2 id="statVehiculos">--</h2>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card bg-success text-white p-3 text-center mt-3 mt-md-0">
                            <h5>Ingresos Generados este Mes</h5>
                            <h2 id="statIngresos">$ --</h2>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">🔔 Avisos de la Semana</h5>
                        <button class="btn btn-sm btn-outline-dark" onclick="cargarAvisosSemana()">🔄 Actualizar</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha</th><th>Cliente</th><th>Patente</th><th>Servicio</th><th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAvisosBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="buscar" role="tabpanel">
                <div class="card p-4 mb-4 bg-light">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="header-title mb-0">Buscador Vehicular</h5>
                        <button class="btn btn-sm btn-secondary" onclick="limpiarBusqueda()">❌ Limpiar Búsqueda</button>
                    </div>
                    <div class="input-group">
                        <input type="text" id="buscarPatente" class="form-control text-uppercase" placeholder="Ingrese Patente (ej: AA123CD)">
                        <button class="btn btn-primary" onclick="buscarPorPatente()">Buscar</button>
                    </div>
                    <div id="resultadoBusqueda" class="mt-4"></div>
                </div>
            </div>

            <div class="tab-pane fade" id="nuevo" role="tabpanel">
                <div class="card p-4">
                    <h4 class="mb-4 text-center">Registrar Nuevo Mantenimiento</h4>
                    <form id="mantenimientoForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre del Cliente</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono (WhatsApp)</label>
                                <input type="tel" class="form-control" id="telefono" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Patente / Dominio</label>
                                <input type="text" class="form-control text-uppercase" id="patente" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Kilometraje</label>
                                <input type="number" class="form-control" id="kilometraje" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Costo Total ($)</label>
                                <input type="number" class="form-control bg-light text-success fw-bold" id="costo" placeholder="Ej: 45000" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Fecha del Servicio</label>
                                <input type="date" class="form-control" id="fecha_servicio" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Próximo Mantenimiento</label>
                                <input type="date" class="form-control" id="fecha_proximo" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Trabajo Realizado</label>
                            <textarea class="form-control" id="trabajo" rows="2" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Guardar Mantenimiento</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://app-mecanico.onrender.com';
    let tallerActualId = null;
    let nombreTallerActual = "Taller Mecánico";
    let ultimosRegistrosEncontrados = [];

    // --- LOGICA DE LOGIN Y BIOMETRIA ---
    window.addEventListener('DOMContentLoaded', () => {
        if (!window.PublicKeyCredential) document.getElementById('btnBiometria').style.display = 'none';
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        await ejecutarLogin(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    });

    document.getElementById('btnBiometria').addEventListener('click', async () => {
        const e = localStorage.getItem('taller_email_biometrico');
        const p = localStorage.getItem('taller_pass_biometrico');
        if (!e || !p) return alert('Primero ingresa con correo y clave para vincular huella.');
        await ejecutarLogin(e, p);
    });

    async function ejecutarLogin(email, password) {
        const btn = document.getElementById('btnIngresar');
        btn.disabled = true; btn.innerText = "Verificando...";
        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.exito) {
                tallerActualId = data.id_taller;
                nombreTallerActual = data.nombre_taller || "Taller Mecánico";
                localStorage.setItem('taller_email_biometrico', email);
                localStorage.setItem('taller_pass_biometrico', password);
                
                document.getElementById('tituloTaller').innerText = "🔧 " + nombreTallerActual;
                document.getElementById('seccionLogin').classList.add('oculto');
                document.getElementById('seccionApp').classList.remove('oculto');

                cargarAvisosSemana();
                cargarEstadisticas();
            } else alert(data.mensaje || 'Credenciales incorrectas');
        } catch (error) {
            alert('Error de conexión.');
        } finally {
            btn.disabled = false; btn.innerText = "Ingresar";
        }
    }

    // --- DASHBOARD Y ESTADÍSTICAS ---
    async function cargarEstadisticas() {
        try {
            const res = await fetch(`${API_URL}/api/estadisticas?id_taller=${tallerActualId}`);
            const data = await res.json();
            if(data.exito){
                document.getElementById('statVehiculos').innerText = data.totalVehiculos;
                document.getElementById('statIngresos').innerText = `$ ${data.ingresosMes.toLocaleString()}`;
            }
        } catch(e) { console.error("Error estadísticas:", e); }
    }

    async function cargarAvisosSemana() {
        const tbody = document.getElementById('tablaAvisosBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Cargando...</td></tr>';
        try {
            const res = await fetch(`${API_URL}/avisos-semana?id_taller=${tallerActualId}`);
            const avisos = await res.json();
            if (!avisos.length) return tbody.innerHTML = '<tr><td colspan="5" class="text-center text-success">¡Sin vencimientos cercanos!</td></tr>';
            
            tbody.innerHTML = avisos.map(i => {
                const nombre = i.clientes?.nombre || '';
                const tel = i.clientes?.telefono || '';
                const pat = i.vehiculos?.patente || '';
                const mje = encodeURIComponent(`Hola ${nombre}, te recordamos desde el Taller que tu vehículo (${pat}) tiene programado su mantenimiento para el ${i.fecha_proximo}.`);
                return `<tr>
                    <td><span class="badge bg-danger">${i.fecha_proximo}</span></td>
                    <td>${nombre}</td><td><span class="badge bg-secondary">${pat}</span></td>
                    <td>${i.mantenimiento_realizado}</td>
                    <td>${tel ? `<a href="https://wa.me/${tel.replace(/\D/g, '')}?text=${mje}" target="_blank" class="btn btn-sm btn-success">📲 WA</a>` : '-'}</td>
                </tr>`;
            }).join('');
        } catch (e) { tbody.innerHTML = '<tr><td colspan="5" class="text-danger">Error.</td></tr>'; }
    }

    // --- BUSQUEDA Y ELIMINACIÓN ---
    function limpiarBusqueda() {
        document.getElementById('buscarPatente').value = '';
        document.getElementById('resultadoBusqueda').innerHTML = '';
        ultimosRegistrosEncontrados = [];
    }

    async function buscarPorPatente() {
        const patente = document.getElementById('buscarPatente').value.trim();
        const contenedor = document.getElementById('resultadoBusqueda');
        if (!patente) return alert("Ingrese patente.");
        contenedor.innerHTML = "<p class='text-muted'>Buscando...</p>";

        try {
            const res = await fetch(`${API_URL}/api/registros/buscar?patente=${patente}&id_taller=${tallerActualId}`);
            const data = await res.json();
            if (data.exito && data.registros.length > 0) {
                ultimosRegistrosEncontrados = data.registros;
                let unificados = [];
                let info = data.registros[0];
                data.registros.forEach(r => unificados = unificados.concat(r.mantenimientos || []));
                unificados.sort((a, b) => new Date(b.fecha_actual) - new Date(a.fecha_actual));
                info.todosMantenimientos = unificados;

                let html = `
                    <div class='d-flex justify-content-between align-items-center mb-3 bg-white p-3 rounded shadow-sm border'>
                        <div>
                            <h5 class='mb-0'>${info.nombre_completo}</h5>
                            <small class='text-muted'>📱 ${info.telefono} | 🚗 ${info.patente}</small>
                        </div>
                        <div>
                            <button class='btn btn-success btn-sm' onclick='imprimir(0, true)'>📋 Todo</button>
                            <button class='btn btn-dark btn-sm' onclick='imprimir(0, false)'>📄 Último</button>
                        </div>
                    </div><ul class='list-group'>`;

                if (unificados.length > 0) {
                    unificados.forEach(m => {
                        html += `<li class='list-group-item'>
                            <div class="d-flex justify-content-between">
                                <div>📅 ${m.fecha_actual} | 🚗 ${m.kilometraje} km | 💰 $${m.costo || 0}<br>🔧 ${m.trabajo_realizado}</div>
                                <button class="btn btn-sm btn-outline-danger align-self-center" onclick="eliminarRegistro(${m.id_servicio})">🗑️ Eliminar</button>
                            </div>
                        </li>`;
                    });
                } else html += `<li class='list-group-item'>Sin servicios.</li>`;
                contenedor.innerHTML = html + "</ul>";
            } else contenedor.innerHTML = "<div class='alert alert-warning'>No encontrado.</div>";
        } catch (e) { contenedor.innerHTML = "<div class='alert alert-danger'>Error.</div>"; }
    }

    async function eliminarRegistro(idServicio) {
        if(!confirm('¿Estás seguro de que deseas ELIMINAR este registro para siempre?')) return;
        try {
            const res = await fetch(`${API_URL}/api/mantenimiento/${idServicio}`, { method: 'DELETE' });
            const data = await res.json();
            if(data.exito) {
                alert('Registro eliminado.');
                buscarPorPatente(); // Refrescar búsqueda
                cargarEstadisticas(); // Refrescar montos
            } else alert('Error al eliminar');
        } catch(e) { alert('Error de conexión'); }
    }

    // --- GUARDAR NUEVO ---
    document.getElementById('mantenimientoForm').addEventListener('submit', async e => {
        e.preventDefault();
        const datos = {
            id_taller: tallerActualId,
            nombre: document.getElementById('nombre').value,
            telefono: document.getElementById('telefono').value,
            patente: document.getElementById('patente').value,
            kilometraje: document.getElementById('kilometraje').value,
            costo: document.getElementById('costo').value,
            fecha_servicio: document.getElementById('fecha_servicio').value,
            fecha_proximo: document.getElementById('fecha_proximo').value,
            trabajo: document.getElementById('trabajo').value
        };

        try {
            const res = await fetch(`${API_URL}/api/guardar-mantenimiento`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
            });
            const data = await res.json();
            if (data.exito) {
                alert('¡Guardado con éxito!');
                if (confirm('¿Enviar WhatsApp?')) window.open(`https://api.whatsapp.com/send?phone=${datos.telefono}&text=Hola ${datos.nombre}...`, '_blank');
                document.getElementById('mantenimientoForm').reset();
                cargarAvisosSemana();
                cargarEstadisticas();
                // Volver a la pestaña principal
                const triggerEl = document.querySelector('#dashboard-tab');
                bootstrap.Tab.getOrCreateInstance(triggerEl).show();
            } else alert('Error: ' + data.mensaje);
        } catch (err) { alert('Error de conexión.'); }
    });

    // --- IMPRESIÓN ---
    function imprimir(index, completo) {
        const v = ultimosRegistrosEncontrados[index];
        if (!v || !v.todosMantenimientos.length) return alert("Sin datos.");
        
        const data = completo ? v.todosMantenimientos : [v.todosMantenimientos[0]];
        let trs = data.map((m, i) => `<tr>
            <td style="padding:10px; border-bottom:1px solid #ddd;">#${data.length - i}</td>
            <td style="padding:10px; border-bottom:1px solid #ddd;">${m.fecha_actual}</td>
            <td style="padding:10px; border-bottom:1px solid #ddd;">${m.kilometraje} km</td>
            <td style="padding:10px; border-bottom:1px solid #ddd;">$${m.costo || 0}</td>
            <td style="padding:10px; border-bottom:1px solid #ddd;">${m.trabajo_realizado}</td>
        </tr>`).join('');

        let win = window.open('', '_blank', 'width=850,height=700');
        win.document.write(`
            <html lang="es"><head><title>Ficha ${v.patente}</title>
            <style>body{font-family:sans-serif; padding:20px;} table{width:100%; border-collapse:collapse; margin-top:20px;} th{background:#2b6cb0; color:#fff; padding:10px;}</style>
            </head><body>
            <h2>🔧 ${nombreTallerActual}</h2>
            <p><strong>Cliente:</strong> ${v.nombre_completo} | <strong>Patente:</strong> ${v.patente}</p>
            <table><tr><th>#</th><th>Fecha</th><th>Km</th><th>Costo</th><th>Trabajo</th></tr>${trs}</table>
            <script>window.onload=()=>window.print();<\/script>
            </body></html>
        `);
        win.document.close();
    }

    document.getElementById('btnCerrarSesion').addEventListener('click', () => location.reload());
</script>
</body>
</html>
