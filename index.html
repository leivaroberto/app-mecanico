<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMecanico - Panel de Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .header-title { color: #2c3e50; font-weight: bold; }
        .oculto { display: none !important; }
        .nav-tabs .nav-link { font-weight: 600; color: #6c757d; }
        .nav-tabs .nav-link.active { color: #2b6cb0; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-4 mb-5">

    <div id="seccionLogin" class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card p-4 text-center">
                <h2 class="header-title mb-1">🔧 AppMecanico</h2>
                <p class="text-muted mb-4">Acceso Seguro de Taller</p>
                <form id="loginForm" class="text-start">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="admin@taller.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="******" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" id="btnIngresar" class="btn btn-dark btn-lg">Ingresar con Clave</button>
                        <button type="button" id="btnBiometria" class="btn btn-outline-primary mt-2">👆 Entrar con Huella / Face ID</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="seccionApp" class="oculto">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="tituloTaller" class="header-title">🔧 Taller Mecánico</h2>
            <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>

        <ul class="nav nav-tabs mb-4" id="appTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button" role="tab">📊 Inicio</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="buscar-tab" data-bs-toggle="tab" data-bs-target="#buscar" type="button" role="tab">🔍 Buscar Historial</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="nuevo-tab" data-bs-toggle="tab" data-bs-target="#nuevo" type="button" role="tab">📝 Registrar Servicio</button>
            </li>
        </ul>

        <div class="tab-content">
            
            <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">🔔 Recordatorios / Avisos de la Semana</h5>
                        <button class="btn btn-sm btn-outline-dark" onclick="cargarAvisosSemana()">🔄 Actualizar</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Fecha Próxima</th><th>Cliente</th><th>Patente</th><th>Servicio a realizar</th><th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAvisosBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="buscar" role="tabpanel">
                <div class="card p-4 mb-4 bg-light">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="header-title mb-0">🔍 Buscador Vehicular</h5>
                        <button class="btn btn-sm btn-secondary" onclick="limpiarBusqueda()">❌ Limpiar Búsqueda</button>
                    </div>
                    <div class="input-group">
                        <input type="text" id="buscarPatente" class="form-control text-uppercase" placeholder="Ingrese Patente (ej: AA123CD)">
                        <button class="btn btn-primary" onclick="buscarPorPatente()">Buscar</button>
                    </div>
                    <div id="resultadoBusqueda" class="mt-4"></div>
                </div>
            </div>

            <div class="tab-pane fade" id="nuevo" role="tabpanel">
                <div class="card p-4">
                    <h4 class="mb-4 text-center">Registrar Nuevo Mantenimiento</h4>
                    <form id="mantenimientoForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre del Cliente</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono (WhatsApp)</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Ej: +5491122334455" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Patente / Dominio</label>
                                <input type="text" class="form-control text-uppercase" id="patente" placeholder="AB123CD" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Kilometraje Actual</label>
                                <input type="number" class="form-control" id="kilometraje" placeholder="Ej: 85000" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Fecha del Servicio</label>
                                <input type="date" class="form-control" id="fecha_servicio" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fecha Próximo Mantenimiento</label>
                                <input type="date" class="form-control" id="fecha_proximo" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Trabajo Realizado</label>
                            <textarea class="form-control" id="trabajo" rows="3" placeholder="Ej: Cambio de aceite y filtros" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Guardar Mantenimiento</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://app-mecanico.onrender.com';
    let tallerActualId = null;
    let nombreTallerActual = "Taller Mecánico";
    let ultimosRegistrosEncontrados = [];

    // --- LOGICA DE LOGIN Y BIOMETRIA ---
    window.addEventListener('DOMContentLoaded', () => {
        if (!window.PublicKeyCredential) document.getElementById('btnBiometria').style.display = 'none';
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        await ejecutarLogin(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    });

    document.getElementById('btnBiometria').addEventListener('click', async () => {
        const e = localStorage.getItem('taller_email_biometrico');
        const p = localStorage.getItem('taller_pass_biometrico');
        if (!e || !p) return alert('Primero ingresa una vez con correo y clave para vincular tu huella.');
        await ejecutarLogin(e, p);
    });

    async function ejecutarLogin(email, password) {
        const btn = document.getElementById('btnIngresar');
        btn.disabled = true; btn.innerText = "Verificando...";
        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.exito) {
                tallerActualId = data.id_taller;
                nombreTallerActual = data.nombre_taller || "Taller Mecánico";
                localStorage.setItem('taller_email_biometrico', email);
                localStorage.setItem('taller_pass_biometrico', password);
                
                document.getElementById('tituloTaller').innerText = "🔧 " + nombreTallerActual;
                document.getElementById('seccionLogin').classList.add('oculto');
                document.getElementById('seccionApp').classList.remove('oculto');

                cargarAvisosSemana();
            } else alert(data.mensaje || 'Credenciales incorrectas');
        } catch (error) {
            alert('Error de conexión con el servidor.');
        } finally {
            btn.disabled = false; btn.innerText = "Ingresar con Clave";
        }
    }

    async function cargarAvisosSemana() {
        const tbody = document.getElementById('tablaAvisosBody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Cargando avisos...</td></tr>';
        try {
            const res = await fetch(`${API_URL}/avisos-semana?id_taller=${tallerActualId}`);
            const avisos = await res.json();
            if (!avisos || !avisos.length) return tbody.innerHTML = '<tr><td colspan="5" class="text-center text-success">¡Sin vencimientos en los próximos 7 días! 🎉</td></tr>';
            
            tbody.innerHTML = avisos.map(i => {
                const nombre = i.clientes?.nombre || 'Sin nombre';
                const tel = i.clientes?.telefono || '';
                const pat = i.vehiculos?.patente || 'N/A';
                const mje = encodeURIComponent(`Hola ${nombre}, te recordamos desde el Taller que tu vehículo (${pat}) tiene programado su próximo mantenimiento para la fecha ${i.fecha_proximo}.`);
                return `<tr>
                    <td><span class="badge bg-danger">${i.fecha_proximo}</span></td>
                    <td><strong>${nombre}</strong></td>
                    <td><span class="badge bg-secondary">${pat}</span></td>
                    <td>${i.mantenimiento_realizado}</td>
                    <td>${tel ? `<a href="https://wa.me/${tel.replace(/\D/g, '')}?text=${mje}" target="_blank" class="btn btn-sm btn-success">📲 Enviar WA</a>` : '<span class="text-muted">Sin teléfono</span>'}</td>
                </tr>`;
            }).join('');
        } catch (e) { tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center">Error al consultar avisos.</td></tr>'; }
    }

    // --- BUSQUEDA, LIMPIAR Y ELIMINAR ---
    function limpiarBusqueda() {
        document.getElementById('buscarPatente').value = '';
        document.getElementById('resultadoBusqueda').innerHTML = '';
        ultimosRegistrosEncontrados = [];
    }

    async function buscarPorPatente() {
        const patente = document.getElementById('buscarPatente').value.trim();
        const contenedor = document.getElementById('resultadoBusqueda');
        if (!patente) return alert("Ingrese una patente para buscar.");
        contenedor.innerHTML = "<p class='text-muted'>Buscando en la base de datos...</p>";

        try {
            const res = await fetch(`${API_URL}/api/registros/buscar?patente=${patente}&id_taller=${tallerActualId}`);
            const data = await res.json();
            if (data.exito && data.registros.length > 0) {
                ultimosRegistrosEncontrados = data.registros;
                let unificados = [];
                let clienteInfo = data.registros[0];
                data.registros.forEach(r => unificados = unificados.concat(r.mantenimientos || []));
                unificados.sort((a, b) => new Date(b.fecha_actual) - new Date(a.fecha_actual));
                clienteInfo.todosMantenimientos = unificados;

                let html = `
                    <div class='card p-3 border-secondary mb-3'>
                        <div class='d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2'>
                            <div>
                                <h5 class='mb-1'><strong>Cliente:</strong> ${clienteInfo.nombre_completo}</h5>
                                <p class='mb-0 text-muted'>📱 <strong>Teléfono:</strong> ${clienteInfo.telefono} | 🚗 <strong>Patente:</strong> <span class='badge bg-dark fs-6'>${clienteInfo.patente}</span></p>
                            </div>
                            <div class='d-flex gap-2'>
                                <button class='btn btn-success btn-sm' onclick='imprimirHistorialCompleto(0)'>📋 Imprimir Historial Completo (${unificados.length})</button>
                                <button class='btn btn-outline-dark btn-sm' onclick='imprimirUltimoServicio(0)'>📄 Imprimir Último Servicio</button>
                            </div>
                        </div>

                        <h6 class='border-bottom pb-2 mt-2'><strong>Historial de Intervenciones:</strong></h6>
                        <ul class='list-group list-group-flush'>`;

                if (unificados.length > 0) {
                    unificados.forEach(m => {
                        html += `
                            <li class='list-group-item px-0'>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        📅 <strong>Fecha:</strong> ${m.fecha_actual || '-'} | 🚗 <strong>Km:</strong> ${m.kilometraje ? m.kilometraje.toLocaleString() + ' km' : '-'}<br>
                                        🔧 <strong>Trabajo:</strong> ${m.trabajo_realizado || '-'} <br>
                                        🔔 <strong class='text-danger'>Próximo Mantenimiento:</strong> ${m.fecha_proximo || '-'}
                                    </div>
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarRegistro(${m.id_servicio})">🗑️ Eliminar</button>
                                </div>
                            </li>`;
                    });
                } else {
                    html += `<li class='list-group-item text-muted'>No hay mantenimientos registrados para este vehículo.</li>`;
                }

                contenedor.innerHTML = html + "</ul></div>";
            } else {
                contenedor.innerHTML = "<div class='alert alert-warning mt-2'>No se encontraron registros para esa patente.</div>";
            }
        } catch (e) { contenedor.innerHTML = "<div class='alert alert-danger mt-2'>Error al conectar con el servidor.</div>"; }
    }

    async function eliminarRegistro(idServicio) {
        if(!confirm('¿Estás seguro de que deseas ELIMINAR este registro para siempre?')) return;
        try {
            const res = await fetch(`${API_URL}/api/mantenimiento/${idServicio}`, { method: 'DELETE' });
            const data = await res.json();
            if(data.exito) {
                alert('Registro eliminado.');
                buscarPorPatente();
            } else alert('Error al eliminar registro');
        } catch(e) { alert('Error de conexión.'); }
    }

    // --- FORMATO DE IMPRESIÓN (SIN COSTOS) ---
    function imprimirHistorialCompleto(index) {
        const vehiculo = ultimosRegistrosEncontrados[index];
        if (!vehiculo || !vehiculo.todosMantenimientos || vehiculo.todosMantenimientos.length === 0) return alert("No hay mantenimientos para imprimir.");

        let ventana = window.open('', '_blank', 'width=850,height=700');
        let mantenimientosHTML = '';

        vehiculo.todosMantenimientos.forEach((m, i) => {
            mantenimientosHTML += `
                <tr>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center; font-weight: bold;">#${vehiculo.todosMantenimientos.length - i}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center;">${m.fecha_actual || '-'}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; font-weight: bold;">${m.kilometraje ? m.kilometraje.toLocaleString() + ' km' : '-'}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${m.trabajo_realizado || '-'}</td>
                    <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center; color: #c53030; font-weight: bold;">${m.fecha_proximo || '-'}</td>
                </tr>`;
        });

        abrirVentanaImpresion(ventana, "Historial Clínico Vehicular - Completo", vehiculo, mantenimientosHTML);
    }

    function imprimirUltimoServicio(index) {
        const vehiculo = ultimosRegistrosEncontrados[index];
        if (!vehiculo || !vehiculo.todosMantenimientos || vehiculo.todosMantenimientos.length === 0) return alert("No hay mantenimientos para imprimir.");

        const ultimo = vehiculo.todosMantenimientos[0];
        let ventana = window.open('', '_blank', 'width=850,height=700');

        let mantenimientosHTML = `
            <tr>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center; font-weight: bold;">1</td>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center;">${ultimo.fecha_actual || '-'}</td>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right; font-weight: bold;">${ultimo.kilometraje ? ultimo.kilometraje.toLocaleString() + ' km' : '-'}</td>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${ultimo.trabajo_realizado || '-'}</td>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: center; color: #c53030; font-weight: bold;">${ultimo.fecha_proximo || '-'}</td>
            </tr>`;

        abrirVentanaImpresion(ventana, "Comprobante de Último Servicio Realizado", vehiculo, mantenimientosHTML);
    }

    function abrirVentanaImpresion(ventana, tituloDocumento, vehiculo, mantenimientosHTML) {
        ventana.document.write(`
            <!DOCTYPE html>
            <html lang="es">
            <head>
                <meta charset="UTF-8">
                <title>${tituloDocumento} - ${vehiculo.patente}</title>
                <style>
                    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; color: #2d3748; }
                    .header { text-align: center; border-bottom: 3px solid #2b6cb0; padding-bottom: 15px; margin-bottom: 25px; }
                    .header h2 { margin: 0; color: #2b6cb0; font-size: 24px; text-transform: uppercase; }
                    .header h3 { margin: 5px 0 0 0; color: #4a5568; font-size: 16px; font-weight: normal; }
                    .info-card { background: #f7fafc; border: 1px solid #e2e8f0; border-left: 5px solid #2b6cb0; padding: 15px; border-radius: 6px; margin-bottom: 25px; display: flex; justify-content: space-between; }
                    .patente-badge { font-size: 20px; font-weight: bold; background: #2d3748; color: #fff; padding: 4px 12px; border-radius: 4px; letter-spacing: 2px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                    th { background-color: #2b6cb0; color: white; padding: 10px; text-align: left; font-size: 13px; text-transform: uppercase; }
                    .footer { margin-top: 50px; text-align: center; font-size: 11px; color: #a0aec0; border-top: 1px solid #e2e8f0; padding-top: 15px; }
                </style>
            </head>
            <body>
                <div class="header">
                    <h2>🔧 ${nombreTallerActual}</h2>
                    <h3>${tituloDocumento}</h3>
                </div>

                <div class="info-card">
                    <div>
                        <div><strong>Cliente:</strong> ${vehiculo.nombre_completo}</div>
                        <div><strong>Teléfono / WhatsApp:</strong> ${vehiculo.telefono}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 12px; color: #718096; margin-bottom: 4px;">PATENTE</div>
                        <span class="patente-badge">${vehiculo.patente}</span>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th style="text-align: center; width: 40px;">#</th>
                            <th style="text-align: center; width: 110px;">Fecha</th>
                            <th style="text-align: right; width: 110px;">Kilometraje</th>
                            <th>Trabajo Realizado</th>
                            <th style="text-align: center; width: 130px;">Próximo Servicio</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${mantenimientosHTML}
                    </tbody>
                </table>

                <div class="footer">
                    <p>Documento generado por AppMecanico para <strong>${nombreTallerActual}</strong> | ${new Date().toLocaleDateString('es-AR')}</p>
                </div>

                <script>
                    window.onload = function() { window.print(); };
                <\/script>
            </body>
            </html>
        `);
        ventana.document.close();
    }

    // --- GUARDAR NUEVO ---
    document.getElementById('mantenimientoForm').addEventListener('submit', async e => {
        e.preventDefault();
        const datos = {
            id_taller: tallerActualId,
            nombre: document.getElementById('nombre').value,
            telefono: document.getElementById('telefono').value,
            patente: document.getElementById('patente').value,
            kilometraje: document.getElementById('kilometraje').value,
            fecha_servicio: document.getElementById('fecha_servicio').value,
            fecha_proximo: document.getElementById('fecha_proximo').value,
            trabajo: document.getElementById('trabajo').value
        };

        try {
            const res = await fetch(`${API_URL}/api/guardar-mantenimiento`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
            });
            const data = await res.json();
            if (data.exito) {
                alert('¡Mantenimiento guardado con éxito!');
                if (confirm('¿Deseas abrir WhatsApp para enviarle el recordatorio al cliente?')) {
                    let mensaje = `¡Hola ${datos.nombre}! Te escribimos del taller para recordarte que tu vehículo (${datos.patente}) se acerca a su mantenimiento el ${datos.fecha_proximo}.`;
                    window.open(`https://api.whatsapp.com/send?phone=${encodeURIComponent(datos.telefono)}&text=${encodeURIComponent(mensaje)}`, '_blank');
                }
                document.getElementById('mantenimientoForm').reset();
                cargarAvisosSemana();
                
                // Volver a la solapa principal
                const triggerEl = document.querySelector('#dashboard-tab');
                bootstrap.Tab.getOrCreateInstance(triggerEl).show();
            } else alert('Error al guardar: ' + data.mensaje);
        } catch (err) { alert('Error de conexión al guardar.'); }
    });

    document.getElementById('btnCerrarSesion').addEventListener('click', () => location.reload());
</script>
</body>
</html>
